version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:13-alpine
    container_name: asset_mgmt_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-asset_management}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - asset_network
    restart: unless-stopped

  # Flask Backend
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: asset_mgmt_backend
    environment:
      FLASK_APP: backend/app.py
      FLASK_ENV: ${FLASK_ENV:-development}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-asset_management}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres123}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      PYTHONUNBUFFERED: 1
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app/backend
      - ./backend/logs:/app/backend/logs
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - asset_network
    restart: unless-stopped
    command: gunicorn --bind 0.0.0.0:5000 --workers 4 --timeout 120 backend.app:app

  # Nginx Web Server
  nginx:
    image: nginx:alpine
    container_name: asset_mgmt_nginx
    ports:
      - "8090:80"
      - "8453:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
      - ./docker/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
    networks:
      - asset_network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  asset_network:
    driver: bridge
