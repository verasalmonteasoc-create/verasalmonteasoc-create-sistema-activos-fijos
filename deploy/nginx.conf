# Configuración del nginx propio de este stack (af_activos_nginx).
# Corre DENTRO de un contenedor y escucha en los puertos 80/443 del contenedor,
# que en el host se publican como 8080/8443 (ver docker-compose.prod.yml).
# Termina TLS y hace proxy hacia el backend (Flask/Gunicorn) por la red interna.

server {
    listen 80;
    listen [::]:80;
    server_name af.aplicacionesrd.com;

    # Ruta para la validación ACME de Let's Encrypt (webroot).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Todo lo demás se redirige a HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name af.aplicacionesrd.com;
    http2 on;

    # Certificado: al principio es autofirmado (lo genera el init ssl_init).
    # Cuando emitas el real con scripts/issue_cert.sh, se copia a esta misma
    # ruta y solo hace falta recargar nginx.
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 50M;

    location / {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }
}
