# ── Sistema de Activos Fijos (af.aplicacionesrd.com) ──
#
# Este archivo NO es del nginx de nuestro stack: se instala dentro del nginx del
# otro proyecto (tesoreria-nginx), que es el que posee los puertos 80/443 del
# servidor. Su ruta dentro de ese contenedor es:
#     /etc/letsencrypt/af-vhost/af.aplicacionesrd.com.conf
# y se activa con la línea `include /etc/letsencrypt/af-vhost/*.conf;` dentro
# del bloque http de su nginx.conf.
#
# Lo instala y repara automáticamente: scripts/ensure_vhost.sh
# NO pertenece a la configuración de tesorería y no altera sus sitios.

server {
    listen 80;
    server_name af.aplicacionesrd.com;

    # Validación ACME de Let's Encrypt por webroot (si algún día se usa HTTP-01)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name af.aplicacionesrd.com;

    # Copia del certificado de Let's Encrypt de nuestro stack. La mantiene
    # sincronizada scripts/ensure_vhost.sh tras cada renovación.
    ssl_certificate     /etc/letsencrypt/af-activos/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/af-activos/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 50M;

    location / {
        # Reenvía al nginx de NUESTRO stack, que escucha en el 8443 del host.
        # Se usa la IP pública del servidor porque, desde dentro de este
        # contenedor, 127.0.0.1 sería el contenedor mismo y no el host.
        proxy_pass https://157.245.247.91:8443;
        proxy_ssl_server_name on;
        proxy_ssl_name af.aplicacionesrd.com;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
