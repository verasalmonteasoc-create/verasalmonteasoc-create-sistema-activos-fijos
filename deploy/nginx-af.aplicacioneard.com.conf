# Server block para af.aplicacioneard.com
# Sistema de Gestión de Activos Fijos
#
# Este bloque es solo HTTP (puerto 80). Como ya tienes Let's Encrypt/certbot
# configurado en este servidor, corre lo siguiente UNA VEZ que este archivo
# esté copiado a /etc/nginx/sites-available/ y habilitado, y el DNS del
# dominio ya apunte a este servidor:
#
#   sudo certbot --nginx -d af.aplicacioneard.com
#
# certbot reescribirá este archivo automáticamente agregando el bloque
# HTTPS (443) y el redirect desde HTTP. No hace falta que edites nada de SSL
# a mano.

server {
    listen 80;
    listen [::]:80;
    server_name af.aplicacioneard.com;

    client_max_body_size 50M;

    # Proxy hacia el contenedor backend (Flask/Gunicorn), que solo escucha
    # en 127.0.0.1 del host en el puerto APP_PORT definido en .env
    # (por defecto 8010 — debe coincidir con docker-compose.prod.yml).
    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }
}
